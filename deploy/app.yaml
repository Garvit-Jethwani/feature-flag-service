# DigitalOcean App Platform spec. See plans/05-deploy-digitalocean.md.
#
# This file contains no secrets. The two placeholders in double underscores
# are replaced at deploy time, in a copy that is never committed; App Platform
# stores both values encrypted.
name: feature-flag-service
region: blr

services:
  - name: api
    # App Platform clones the public repository and builds the Dockerfile.
    git:
      repo_clone_url: https://github.com/Garvit-Jethwani/feature-flag-service.git
      branch: main
    dockerfile_path: Dockerfile
    http_port: 8080
    # One instance: the evaluation cache and the rate limiter live in the
    # process, so a second instance would have its own copy of each.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
    envs:
      # Connection string of the Managed PostgreSQL cluster (TLS required),
      # read from the DigitalOcean API at deploy time and stored encrypted.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "__DATABASE_URL__"
      - key: API_KEYS
        scope: RUN_TIME
        type: SECRET
        value: "__API_KEYS__"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES

# The database is the Managed PostgreSQL cluster "feature-flag-service-db".
# It is not listed here as an attached database: this account's quota makes
# App Platform reject the attachment (see plans/05-deploy-digitalocean.md),
# so the app receives the connection string as a secret instead.

alerts:
  - rule: DEPLOYMENT_FAILED
