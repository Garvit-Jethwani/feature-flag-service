# Local development stack. Credentials come from .env (run `make env`);
# nothing secret is stored in this file.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flags
      POSTGRES_DB: flags
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "make env" to create .env}
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
