# Local development stack. Credentials come from .env (run `make env`);
# nothing secret is stored in this file.
services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://flags:${POSTGRES_PASSWORD:?run "make env" to create .env}@db:5432/flags?sslmode=disable
      API_KEYS: ${API_KEYS:?run "make env" to create .env}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL: ${CACHE_TTL:-60s}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-100000}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flags
      POSTGRES_DB: flags
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "make env" to create .env}
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
